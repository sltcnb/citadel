id: syslog
name: Syslog
description: >-
  Parses Linux/Unix syslog and journald log files. Supports RFC 3164 and RFC 5424
  formats, as well as common variations from rsyslog and syslog-ng.
  Extracts host, process, PID, and structured message fields.
supported_extensions: [".log"]
supported_mime_types: ["text/plain", "text/x-log"]
handled_filenames:
  - syslog
  - auth.log
  - kern.log
  - daemon.log
  - messages
  - secure
  - dmesg
  - cron.log
  - mail.log
  - debug
  - user.log
  - auth
  - system.log
  - secure.log
  - boot.log
  - cbs.log
  - windowsupdate.log
  - dism.log
  - srttrail.txt
  - setupapi.dev.log
  - setupapi.setup.log
  - pfirewall.log
artifact_type: syslog
author: ForensicsOperator
version: "1.0.0"
tags: [linux, syslog, auth, kernel, unix]
