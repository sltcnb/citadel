id: macos_triage
name: macOS Triage Collection
description: >
  Structured parsing of the live macOS triage snapshot Talon writes as
  system_triage.txt. The file is a sequence of banner-delimited command
  outputs (sw_vers, uname, ps auxww, netstat -anv, ifconfig, netstat -rn,
  arp -an, who, last, mount, df, kextstat, launchctl list, system_profiler,
  networksetup, socketfilterfw, find -perm -4000, env). Each section is
  emitted with the artifact_type its Linux/Windows equivalent already uses —
  process, network_conn, arp_entry, route_entry, logged_user, login_event,
  kernel_module, service, installed_software, env_variable, file,
  system_info — so existing timeline filters and detections work unchanged
  on macOS hosts. Every event carries os=macos and the host's hostname.

  Talon writes the same filename on Linux, so this parser claims
  system_triage.txt only when the content is Darwin-shaped; Linux bundles
  still route to linux_triage.
supported_extensions:
  - .txt
  - .log
supported_mime_types:
  - text/plain
artifact_type: macos_triage
handled_filenames:
  - system_triage.txt
  - macos_triage.txt
author: Citadel
version: "1.0.0"
tags:
  - macos
  - apple
  - darwin
  - triage
  - process
  - network
  - persistence
  - live-response
