id: wrong_account_join
description: 'The alert names the wrong account: the port join shows the nightly SQL agent account. Benign,
  with the discrepancy stated.'
scenario: 'Alert: Uncommon File Dropped Under Noteworthy Folder via SMB


  Machine : srv-web03


  Comptes : NT AUTHORITY\SYSTEM, jsmith


  Indicateurs : 10.70.0.20 (IP) ; 10.70.0.12 (IP)


  Heure de l''occurrence : 2026-10-11 03:15:02 UTC


  Source port : 50550


  Application : SMB


  Partage SMB : ADMIN$


  The file C:\Windows\Temp\sqlprobe_31.tmp was written to the ADMIN$ share of srv-web03 (10.70.0.20) from
  10.70.0.12, under the account jsmith. Prior analysis: benign at 60 % confidence, most likely an internal
  tool testing write access; the source machine was not found in the inventories. The analyst reports
  no recurrence over 7 days and no execution after the drop.'
