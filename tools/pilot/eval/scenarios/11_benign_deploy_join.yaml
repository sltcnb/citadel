id: benign_deploy_join
description: 'Genuinely benign: the port join confirms the alert''s own account, on the nightly schedule
  it has kept for two weeks. High confidence is correct.'
scenario: 'Alert: Uncommon File Dropped Under Noteworthy Folder via SMB


  Machine : srv-app02


  Comptes : NT AUTHORITY\SYSTEM, svc_deploy


  Indicateurs : 10.30.0.20 (IP) ; 10.30.0.15 (IP)


  Heure de l''occurrence : 2026-10-05 02:05:40 UTC


  Source port : 49822


  Application : SMB


  Partage SMB : ADMIN$


  The file C:\Windows\Temp\agent_update_7.msi was written to the ADMIN$ share of srv-app02 (10.30.0.20)
  from 10.30.0.15, under the account svc_deploy. Prior analysis: benign at 70 % confidence, most likely
  an internal tool testing write access; the source machine was not found in the inventories. The analyst
  reports no recurrence over 7 days and no execution after the drop.'
