id: logs_cleared
description: 'Logs cleared two minutes after the alert: the session that would answer it is gone. ''No
  4624 for the port'' is not ''nothing happened''.'
scenario: 'Alert: Uncommon File Dropped Under Noteworthy Folder via SMB


  Machine : srv-db02


  Comptes : NT AUTHORITY\SYSTEM, svc_mon


  Indicateurs : 10.60.0.40 (IP) ; 10.60.0.33 (IP)


  Heure de l''occurrence : 2026-10-14 23:52:03 UTC


  Source port : 60001


  Application : SMB


  Partage SMB : ADMIN$


  The file C:\Windows\svc_probe.tmp was written to the ADMIN$ share of srv-db02 (10.60.0.40) from 10.60.0.33,
  under the account svc_mon. Prior analysis: benign at 60 % confidence, most likely an internal tool testing
  write access; the source machine was not found in the inventories. The analyst reports no recurrence
  over 7 days and no execution after the drop.'
