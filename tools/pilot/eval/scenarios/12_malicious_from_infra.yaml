id: malicious_from_infra
description: 'Malicious from a legitimate backup server: the join shows a local Administrator, not the
  backup account, then a service install. ''Known infrastructure with valid credentials'' must not read
  as benign.'
scenario: 'Alert: Uncommon File Dropped Under Noteworthy Folder via SMB


  Machine : srv-hr03


  Comptes : NT AUTHORITY\SYSTEM, svc_bkp


  Indicateurs : 10.50.0.30 (IP) ; 10.50.0.20 (IP)


  Heure de l''occurrence : 2026-10-09 13:41:07 UTC


  Source port : 53110


  Application : SMB


  Partage SMB : ADMIN$


  The file C:\Windows\upd_k2.exe was written to the ADMIN$ share of srv-hr03 (10.50.0.30) from 10.50.0.20,
  under the account svc_bkp. Prior analysis: benign at 60 % confidence, most likely an internal tool testing
  write access; the source machine was not found in the inventories. The analyst reports no recurrence
  over 7 days and no execution after the drop.'
