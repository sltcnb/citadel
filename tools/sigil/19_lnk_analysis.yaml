category: LNK File Analysis
rules:
  - name: LNK File in Unusual Location
    description: >-
      A shortcut file was found in a non-standard directory.
      LNK files in temp or user directories may indicate malware.
    artifact_type: lnk
    query: "lnk.local_path.ci:*\\\\Temp\\\\* OR lnk.local_path.ci:*\\\\AppData\\\\* OR lnk.local_path.ci:*\\\\Public\\\\*"
    threshold: 1
    mitre: [T1204.001]
    level: medium

  - name: LNK Targeting Script File
    description: >-
      A shortcut points to a script file (PS1, VBS, BAT, CMD).
      Common technique for executing malicious scripts.
    artifact_type: lnk
    query: "lnk.target_path.ci:*\\\\*.ps1* OR lnk.target_path.ci:*\\\\*.vbs* OR lnk.target_path.ci:*\\\\*.bat* OR lnk.target_path.ci:*\\\\*.cmd*"
    threshold: 1
    mitre: [T1204.001]
    level: high

  - name: LNK with Suspicious Arguments
    description: >-
      A shortcut's target arguments contain execution or download markers
      (encoded commands, hidden-window flags, download cradles). Weaponised LNK
      files carry the payload in the argument string rather than the target,
      which is usually a legitimate signed binary.

      Replaces a "LNK with Hidden Window" rule that queried
      ``lnk.show_command``. The parser exposes no window-state field at all — it
      emits target_path, local_path, arguments, working_directory, machine_id,
      description, lnk_filename and the four timestamps — so that rule could
      never match. The ``-w hidden`` / ``-windowstyle`` flags in the argument
      string are the reachable evidence for the same technique.
    artifact_type: lnk
    query: >-
      lnk.arguments.ci:*-w*hidden* OR lnk.arguments.ci:*-windowstyle*
      OR lnk.arguments.ci:*-enc* OR lnk.arguments.ci:*downloadstring*
      OR lnk.arguments.ci:*invoke-* OR lnk.arguments.ci:*frombase64string*
      OR lnk.arguments.ci:*-nop*
    threshold: 1
    mitre: [T1564.003, T1059.001]
    level: high

  - name: LNK Targeting Remote Path
    description: >-
      A shortcut points to a UNC path or remote location.
      May indicate lateral movement or payload staging.
    artifact_type: lnk
    query: 'lnk.target_path.ci:*\\\\*\\* OR lnk.target_path.ci:*\\\\*\$*'
    threshold: 1
    mitre: [T1204.001]
    level: high

  - name: Multiple LNK Files Created Rapidly
    description: >-
      Multiple shortcut files were created in a short time.
      Could indicate worm propagation or mass infection.
    artifact_type: lnk
    query: "lnk.created_at:*"
    threshold: 10
    level: low
