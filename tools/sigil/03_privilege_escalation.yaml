category: Privilege Escalation
rules:
  - name: Account Added to Privileged Group
    description: >-
      A user was added to a Global (4728), Local (4732), or Universal (4756)
      security group — common persistence or privilege escalation step.
    artifact_type: evtx
    query: "evtx.event_id:4728 OR evtx.event_id:4732 OR evtx.event_id:4756"
    threshold: 1
    mitre: [T1098]
    level: high

  - name: New Local User Account Created
    description: >-
      A new Windows user account was created (EID 4720). Attackers create
      accounts for persistent backdoor access.
    artifact_type: evtx
    query: "evtx.event_id:4720"
    threshold: 1
    mitre: [T1136.001]
    level: medium

  - name: Special Privileges Assigned to New Logon
    description: >-
      A high-privilege logon was granted sensitive privileges (EID 4672).

      Tuning: 4672 is emitted for SYSTEM at every boot and for the built-in
      service principals continuously, so a bare match is pure noise. The
      well-known principals and machine accounts (``*$``) are excluded, leaving
      interactive administrative logons — the ones worth reviewing. This stays
      ``low`` because a legitimate admin logon also matches; it is context for
      correlation, not a finding on its own.
    artifact_type: evtx
    query: >-
      evtx.event_id:4672 AND NOT (evtx.event_data.SubjectUserName:"SYSTEM" OR
      evtx.event_data.SubjectUserName:"LOCAL SERVICE" OR
      evtx.event_data.SubjectUserName:"NETWORK SERVICE" OR
      evtx.event_data.SubjectUserName.keyword:*$)
    threshold: 1
    mitre: [T1078]
    level: low

  - name: User Account Enabled
    description: >-
      A disabled user account was re-enabled (EID 4722). Attackers sometimes
      re-activate dormant accounts to avoid creating new, visible ones.
    artifact_type: evtx
    query: "evtx.event_id:4722"
    threshold: 1
    mitre: [T1098]
    level: medium

  - name: Token Privileges Adjusted
    description: >-
      A process token had privileges adjusted or impersonated (EID 4703/4674).
      Used in privilege escalation via token impersonation and manipulation.
    artifact_type: evtx
    query: "evtx.event_id:4703 OR evtx.event_id:4674"
    threshold: 1
    mitre: [T1134]
    level: medium
