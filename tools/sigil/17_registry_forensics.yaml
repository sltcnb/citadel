category: Registry Forensics
rules:
  - name: Shim Database Created
    description: >-
      A shim database was registered.
      Attackers use application shimming for persistence and privilege escalation.
    artifact_type: registry
    query: "registry.key_path.ci:*\\\\AppPatch\\\\Custom*"
    threshold: 1

  - name: Sticky Keys Backdoor
    description: >-
      Sticky Keys or other accessibility executables were modified.
      Common backdoor technique for persistence.
    artifact_type: registry
    query: "registry.key_path.ci:*\\\\Image File Execution Options* AND (registry.matched_value:*sethc* OR registry.matched_value:*utilman* OR registry.matched_value:*osk* OR registry.matched_value:*magnify*)"
    threshold: 1

  - name: Winlogon Helper Modified
    description: >-
      Winlogon notification packages were changed.
      Used for persistence and credential theft.
    artifact_type: registry
    query: "registry.key_path.ci:*\\\\Winlogon* AND (registry.matched_value:*GPExtensions* OR registry.matched_value:*Task* OR registry.matched_value:*System*)"
    threshold: 1

  - name: LSA Security Package Modified
    description: >-
      LSA security packages were changed.
      Attackers add custom packages for credential theft.
    artifact_type: registry
    query: "registry.key_path.ci:*\\\\LSA* AND (registry.matched_value:*Security Packages* OR registry.matched_value:*Authentication Packages*)"
    threshold: 1

  - name: COM Hijacking
    description: >-
      COM object handlers were modified.
      Used for privilege escalation and persistence.
    artifact_type: registry
    query: "registry.key_path.ci:*\\\\CLSID*\\\\InProcServer32* AND NOT registry.matched_value:*System32*"
    threshold: 1

  - name: Silent Process Exit Monitoring
    description: >-
      Silent Process Exit monitoring was configured.
      Used for persistence and process surveillance.
    artifact_type: registry
    query: "registry.key_path.ci:*\\\\SilentProcessExit*"
    threshold: 1
