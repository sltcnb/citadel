syntax = "proto3";

// Citadel collector contract — Talon remote agent <-> Sluice/Citadel.
// Sketch per ROADMAP Appendix A.3. mTLS on the wire; 8MB chunks; sha256 per
// chunk; resumable upload.
package citadel.collector.v1;

option go_package = "github.com/citadel/contracts/collector/v1;collectorv1";

service Collector {
  // Agent announces itself; server returns the tasks it should run.
  rpc Register(AgentHello) returns (TaskList);

  // Long-lived heartbeat; server pushes new Tasks down the stream.
  rpc Heartbeat(stream AgentBeat) returns (stream Task);

  // Resumable, chunked, sha256-verified bundle upload. Every Chunk carries its
  // own upload_token — see the ownership rules on the Chunk message.
  rpc UploadChunk(stream Chunk) returns (UploadAck);
}

message AgentHello {
  string agent_id = 1;
  string hostname = 2;
  string os = 3;            // windows|linux|macos
  string version = 4;       // Talon version
  string enrollment_token = 5;
}

message TaskList { repeated Task tasks = 1; }

message Task {
  string task_id = 1;
  string profile = 2;        // collection profile name
  repeated string artifact_categories = 3;
  repeated string ioc_globs = 4;
  string upload_token = 5;   // case-scoped
}

message AgentBeat {
  string agent_id = 1;
  string current_task_id = 2;
  float progress = 3;        // 0..1
}

message Chunk {
  // Correlation handle for a resumable upload — NOT an authorisation token.
  //
  // The server MUST NOT use this value to select where a chunk is stored, nor
  // to decide which case or task it belongs to. It is chosen by the client, so
  // treating it as a capability lets any agent append to (or overwrite) another
  // agent's upload by guessing or replaying a session_id.
  //
  // Required server-side handling:
  //   1. Authenticate the peer (mTLS client certificate) and validate
  //      upload_token below on EVERY chunk, not just the first.
  //   2. Derive the storage location from the AUTHENTICATED identity plus the
  //      token's case scope — never from session_id.
  //   3. Confirm the session_id is one previously issued to this same
  //      authenticated identity; reject it otherwise.
  string session_id = 1;
  string blob_sha256 = 2;    // full-blob digest
  uint64 offset = 3;         // resume point
  bytes data = 4;            // <= 8MB
  string chunk_sha256 = 5;   // per-chunk digest
  bool last = 6;
  // Case-scoped upload token, as issued in Task.upload_token. Carried on every
  // chunk so ownership is verifiable per message: a stream is long-lived and
  // resumable, so authorising only the first chunk (or only the connection)
  // leaves the rest of the stream unattributed.
  string upload_token = 7;
}

message UploadAck {
  string session_id = 1;
  uint64 bytes_received = 2;
  bool verified = 3;         // full sha256 matched
  string error = 4;
}
