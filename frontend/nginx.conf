server {
    # 8080, not 80: the image is nginx-unprivileged and runs as uid 101, which
    # cannot bind a privileged port. The Service/proxy maps 80 → 8080.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # NOTE: nginx does NOT merge add_header across levels — a location that
    # declares any add_header replaces the inherited set entirely. So these
    # live in a snippet that every such location re-includes below. Adding a
    # header to this file means adding it to security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # index.html must never be cached — it references content-hashed bundles
    # and must always be fresh so browsers pick up new deployments immediately.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # SPA routing — serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively (Vite rotates the hash on each build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }
}
