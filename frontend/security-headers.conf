# Security headers for the frontend SPA.
#
# Included at server level AND re-included in every location block that
# declares an add_header of its own: nginx replaces, never merges, the
# add_header set per level, so a location that sets Cache-Control would
# otherwise serve those responses with no security headers at all.
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
