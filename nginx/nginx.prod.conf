# Citadel — production nginx reverse proxy (TLS-terminating)
# Routes:
#   /api/  → FastAPI (api:8000)
#   /      → Frontend SPA (frontend:80)
#
# Mounted by the proxy service in docker-compose.prod.yml.
#
# ── TLS ───────────────────────────────────────────────────────────────────────
# HTTPS is ALWAYS on. nginx/tls-bootstrap.sh runs before nginx starts and, if
# no certificate is mounted at /etc/nginx/certs, mints a self-signed one — so
# the stack comes up before certificates are provisioned without ever falling
# back to cleartext. Port 80 exists only to redirect to 443 and to carry HSTS.
#
# To install a real certificate, drop fullchain.pem + privkey.pem into
# ./nginx/certs (already mounted into the proxy container) and set your public
# FQDN in the `server_name` directives below, then restart the proxy.
#
# If TLS is terminated by a proxy you already run in front of this stack
# (Caddy / HAProxy / a cloud LB), mount nginx/nginx.behind-proxy.conf instead
# of this file — see the note in docker-compose.prod.yml.

upstream api_backend {
    server api:8000;
    keepalive 16;
}

upstream frontend_backend {
    # nginx-unprivileged listens on 8080 (see frontend/Dockerfile).
    server frontend:8080;
    keepalive 8;
}

# ── Shared proxy/upload settings ──────────────────────────────────────────────
# Forensics artifacts can be large: disk images, memory dumps, ZIP collections
client_max_body_size 2048m;

# Stream request body directly to upstream — required for chunked uploads
proxy_request_buffering off;

proxy_connect_timeout  60s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ── :80 — HSTS + redirect to HTTPS ────────────────────────────────────────────
server {
    listen 80;
    # SERVER_NAME: set this to your public FQDN (e.g. citadel.csirt.example.com).
    server_name _;

    # HSTS on the redirect itself: without it, a first visit over plain HTTP
    # can be pinned to HTTP by an SSL-stripping proxy, because the browser has
    # no standing instruction to refuse the downgrade.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    return 301 https://$host$request_uri;
}

# ── :443 — the real server ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    # SERVER_NAME: set this to your public FQDN (e.g. citadel.csirt.example.com).
    server_name _;

    # Provisioned by nginx/tls-bootstrap.sh: the mounted certificate if there
    # is one, a generated self-signed certificate otherwise.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    location / {
        proxy_pass         http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering off;
    }
}
