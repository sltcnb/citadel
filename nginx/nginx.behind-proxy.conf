# Citadel — nginx reverse proxy for deployments where TLS is terminated
# UPSTREAM (Caddy / HAProxy / a cloud load balancer in front of this stack).
#
# Mount this file instead of nginx.prod.conf when something else already holds
# the certificate:
#     volumes:
#       - ./nginx/nginx.behind-proxy.conf:/etc/nginx/conf.d/default.conf:ro
#
# It listens on plain HTTP only, because the hop in front of it is the one
# doing TLS. That is safe ONLY if this container is not reachable directly —
# bind the published port to loopback (127.0.0.1:8090:80) or keep it on an
# internal network. If clients can reach this listener, use nginx.prod.conf.
#
# HSTS is still emitted here: the header has to reach the browser, and it can
# only do that through whatever terminates TLS in front.

upstream api_backend {
    server api:8000;
    keepalive 16;
}

upstream frontend_backend {
    # nginx-unprivileged listens on 8080 (see frontend/Dockerfile).
    server frontend:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Forensics artifacts can be large: disk images, memory dumps, ZIP collections
    client_max_body_size 2048m;

    # Stream request body directly to upstream — required for chunked uploads
    proxy_request_buffering off;

    proxy_connect_timeout  60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Preserve the scheme the CLIENT used, which the front proxy reports.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    location / {
        proxy_pass         http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering off;
    }
}
