apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: redis-vpa
  namespace: __FO_NAMESPACE__
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redis
  updatePolicy:
    updateMode: "Auto"       # restarts pod with new limits when recommendation diverges significantly
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: redis
        controlledResources: ["memory", "cpu"]
        minAllowed:
          memory: "512Mi"
          cpu: "100m"
        maxAllowed:
          # Ceiling for VPA recommendations. The deployment's redis limit is
          # allocator-sized (__FO_REDIS_MEMORY_LIMIT__, default 8Gi) — if you
          # raise redis's weight in config/resources.yaml beyond ~8Gi, raise
          # this too or the VPA will cap Redis back down.
          memory: "8Gi"
          cpu: "2"
        controlledValues: RequestsAndLimits
