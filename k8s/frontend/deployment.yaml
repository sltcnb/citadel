apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: __FO_NAMESPACE__
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # ── Pod security context ──────────────────────────────────────────────
      # The image is nginxinc/nginx-unprivileged (see frontend/Dockerfile): it
      # runs as uid 101 start to finish and listens on 8080, so nothing here
      # needs root or NET_BIND_SERVICE. The Service maps 80 → 8080, which is
      # why the Ingress backend port is unchanged.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # The frontend is a static-asset nginx: it never talks to the Kubernetes
      # API, so don't hand its container a Service Account token that would
      # turn any RCE in the pod into cluster-level access.
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: __FO_FRONTEND_IMAGE__
          imagePullPolicy: __FO_PULL_POLICY__
          securityContext:
            allowPrivilegeEscalation: false
            # No capabilities needed at all: the process never runs as root and
            # 8080 is unprivileged.
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem left false: nginx writes cache/pid/temp
            # under /var/cache/nginx and /tmp.
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "__FO_FRONTEND_MEMORY_REQUEST__"
              cpu: "__FO_FRONTEND_CPU_REQUEST__"
            limits:
              memory: "__FO_FRONTEND_MEMORY_LIMIT__"
              cpu: "__FO_FRONTEND_CPU_LIMIT__"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: __FO_NAMESPACE__
spec:
  selector:
    app: frontend
  ports:
    # Service port stays 80 so the Ingress backend port is unchanged; the pod
    # listens on 8080 because it runs unprivileged.
    - port: 80
      targetPort: 8080
