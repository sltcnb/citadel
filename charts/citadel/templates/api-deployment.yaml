apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citadel.fullname" . }}-api
  labels:
    {{- include "citadel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "citadel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "citadel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "citadel.image" (dict "ctx" . "component" .Values.api) }}
          imagePullPolicy: {{ include "citadel.pullPolicy" (dict "ctx" . "component" .Values.api) }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "citadel.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secret.existingSecret | default (printf "%s-secret" (include "citadel.fullname" .)) }}
          env:
            # Chunked-upload assembly dir — MUST live on the shared uploads PVC
            # so every api replica sees chunks written by the others (mirrors
            # CHUNK_DIR=/app/uploads/_chunks in k8s/api/deployment.yaml).
            - name: CHUNK_DIR
              value: "/app/uploads/_chunks"
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: plugins
              mountPath: /app/babel
            - name: uploads
              mountPath: /app/uploads
            - name: modules
              mountPath: /app/anvil
      volumes:
        - name: plugins
          persistentVolumeClaim:
            claimName: {{ include "citadel.fullname" . }}-plugins
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "citadel.fullname" . }}-uploads
        - name: modules
          persistentVolumeClaim:
            claimName: {{ include "citadel.fullname" . }}-modules
