apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citadel.fullname" . }}-frontend
  labels:
    {{- include "citadel.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "citadel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "citadel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image is nginxinc/nginx-unprivileged (see frontend/Dockerfile): it
      # runs as uid 101 throughout and listens on 8080, so nothing here needs
      # root or NET_BIND_SERVICE. The Service maps 80 → 8080.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # A static-asset nginx never calls the Kubernetes API; don't give the
      # container a token that would turn an RCE here into cluster access.
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ include "citadel.image" (dict "ctx" . "component" .Values.frontend) }}
          imagePullPolicy: {{ include "citadel.pullPolicy" (dict "ctx" . "component" .Values.frontend) }}
          securityContext:
            allowPrivilegeEscalation: false
            # No capabilities at all: never root, and 8080 is unprivileged.
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.targetPort }}
          livenessProbe:
            {{- toYaml .Values.frontend.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
